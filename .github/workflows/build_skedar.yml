name: Build & Release Skedulr
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
      - name: Decode Keystore & Sign Config
        env:
          SKEDULR_KEYSTORE_BASE64: ${{ secrets.SKEDULR_KEYSTORE_BASE64 }}
          SKEDULR_STORE_PASS: ${{ secrets.SKEDULR_STORE_PASS }}
          SKEDULR_KEY_ALIAS: ${{ secrets.SKEDULR_KEY_ALIAS }}
          SKEDULR_KEY_PASS: ${{ secrets.SKEDULR_KEY_PASS }}
        run: |
          echo "$SKEDULR_KEYSTORE_BASE64" | base64 -d > app/skedulr-release.jks
          printf "\nSKEDULR_STORE_PASS=%s\nSKEDULR_KEY_ALIAS=%s\nSKEDULR_KEY_PASS=%s\n" "$SKEDULR_STORE_PASS" "$SKEDULR_KEY_ALIAS" "$SKEDULR_KEY_PASS" >> gradle.properties
      - run: gradle assembleRelease
      - name: Package & Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p release_out
          cp $(find app/build/outputs/apk/release -name "*.apk" | head -n 1) release_out/Skedulr.apk
          zip -r release_out/Skedulr.zip app/src build.gradle settings.gradle gradle.properties release_out/Skedulr.apk
          gh release view latest >/dev/null 2>&1 && gh release upload latest release_out/Skedulr.apk release_out/Skedulr.zip --clobber || gh release create latest release_out/Skedulr.apk release_out/Skedulr.zip --title "Skedulr Latest Release" --notes "Signed release build v2.7"
