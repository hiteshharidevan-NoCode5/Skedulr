name: Build & Release Skedulr

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Decode Release Keystore
        env:
          SKEDULR_KEYSTORE_BASE64: ${{ secrets.SKEDULR_KEYSTORE_BASE64 }}
        run: echo "$SKEDULR_KEYSTORE_BASE64" | base64 --decode > app/skedulr-release.jks

      - name: Build Signed Release APK
        env:
          SKEDULR_STORE_PASS: ${{ secrets.SKEDULR_STORE_PASS }}
          SKEDULR_KEY_ALIAS: ${{ secrets.SKEDULR_KEY_ALIAS }}
          SKEDULR_KEY_PASS: ${{ secrets.SKEDULR_KEY_PASS }}
        run: gradle assembleRelease

      - name: Package Skedulr.apk and Skedulr.zip
        run: |
          mkdir -p release_out
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          cp "$APK_PATH" release_out/Skedulr.apk
          zip -r release_out/Skedulr.zip app build.gradle settings.gradle gradle.properties release_out/Skedulr.apk

      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest release_out/Skedulr.apk release_out/Skedulr.zip --clobber
          else
            gh release create latest release_out/Skedulr.apk release_out/Skedulr.zip \
              --title "Skedulr Latest Release" \
              --notes "Signed release build of Skedulr (updates in place without uninstalling)."
          fi
