name: Build & Release Skedulr

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Decode Release Keystore
        env:
          SKEDULR_KEYSTORE_BASE64: ${{ secrets.SKEDULR_KEYSTORE_BASE64 }}
        run: echo "$SKEDULR_KEYSTORE_BASE64" | base64 --decode > app/skedulr-release.jks

      - name: Build Signed Release APK
        env:
          SKEDULR_STORE_PASS: ${{ secrets.SKEDULR_STORE_PASS }}
          SKEDULR_KEY_ALIAS: ${{ secrets.SKEDULR_KEY_ALIAS }}
          SKEDULR_KEY_PASS: ${{ secrets.SKEDULR_KEY_PASS }}
        run: gradle assembleRelease

      - name: Package Skedulr.apk and Skedulr.zip
        run: |
          mkdir -p release_out
          cp app/build/outputs/apk/release/Skedulr-release.apk release_out/Skedulr.apk
          zip -r release_out/Skedulr.zip app build.gradle settings.gradle gradle.properties release_out/Skedulr.apk

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Skedulr Latest Release
          body: "Signed release build of Skedulr (installs directly over previous signed versions without uninstalling)."
          files: |
            release_out/Skedulr.apk
            release_out/Skedulr.zip
