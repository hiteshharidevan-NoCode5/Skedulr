plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.nocode5.skedar'
    compileSdk 34

    defaultConfig {
        applicationId "com.nocode5.skedar"
        minSdk 26
        targetSdk 34
        versionCode 13
        versionName "2.6"
        setProperty("archivesBaseName", "Skedulr")
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    signingConfigs {
        release {
            def ksFile = file("skedulr-release.jks")
            if (ksFile.exists()) {
                storeFile ksFile
                storePassword System.getenv("SKEDULR_STORE_PASS")
                keyAlias System.getenv("SKEDULR_KEY_ALIAS")
                keyPassword System.getenv("SKEDULR_KEY_PASS")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
}
